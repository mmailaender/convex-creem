name: Test and lint

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.1.2

      - name: Node setup
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean
        run: pnpm clean

      - name: Build
        run: pnpm build

      - name: Pack package
        run: pnpm pack --pack-destination /tmp/convex-creem-pack

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
